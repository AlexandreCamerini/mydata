name: CI

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: mydata_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -e ".[dev]" -r requisitos.txt

      # Parte da suíte confere o HTML servido de web/dist (login, passkey,
      # botão do semente.id); sem o build ela recebe o aviso "front não
      # construído" e falha por ambiente, não por código.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend for the Python tests
        working-directory: web
        run: npm ci && npm run build

      - name: Test with DuckDB
        env:
          PORTAL_TESTE_LIMITE_CARGA_S: "120"
        run: python -m pytest -q

      # Roda mesmo se o DuckDB falhar: o Postgres é o dialeto de produção e
      # não pode ficar sem prova por causa de uma falha do outro passo.
      - name: Test with PostgreSQL
        if: ${{ !cancelled() }}
        env:
          PORTAL_TESTE_LIMITE_CARGA_S: "120"
          PORTAL_TESTE_POSTGRES: postgresql://postgres:ci-password@localhost:5432/mydata_test
        run: python -m pytest -q

  front:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Test frontend
        run: npm test
